[project]
# Basic project information
name = "mcp-demo-project"
version = "0.1.0"
description = "Demo project with 2 MCP servers and 2 clients"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]

# Project dependencies - these will be installed automatically
dependencies = [
    "mcp>=1.0.0",           # MCP SDK - core protocol implementation
    "anyio>=4.5.0",         # Async I/O library (required by MCP)
    "httpx>=0.27.0",        # HTTP client (for making web requests)
    "click>=8.2.0",         # CLI framework (for command-line arguments)
    "uvicorn>=0.30.0",      # ASGI server (for SSE transport)
    "starlette>=0.37.0",    # Web framework (for SSE transport)
    "jsonschema>=4.0.0",    # json comparison
]

# Optional development dependencies
[dependency-groups]
dev = [
    "pytest>=8.0.0",        # Testing framework
    "ruff>=0.6.0",          # Code formatter and linter
    "pyright>=1.1.0",       # Type checker
]

# CLI entry points - creates executable commands
[project.scripts]
mcp-weather = "servers.weather_server:main"
mcp-calculator = "servers.calculator_server:main"
stdio-client = "clients.stdio_client:main"
sse-client = "clients.sse_client:main"

# Build system configuration
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets. wheel]
packages = ["servers", "clients"]

# Configure Ruff (code formatter)
[tool.ruff]
line-length = 100
target-version = "py311"

# Configure Pyright (type checker)
[tool.pyright]
typeCheckingMode = "basic"